\section{Gaussian integral}\label{sec:gauss}
The integral of $e^{-x^2}$ over the real line is
\begin{equation}\label{eq:gauss}
  \int_{-\infty}^{\infty} e^{-x^2}\,\mathrm{d}x = \sqrt{\pi}.
\end{equation}
Squaring \eqref{eq:gauss} and switching to polar coordinates gives the proof.\footnote{Poisson's trick.}

\begin{theorem}[Normalisation]\label{thm:norm}
For $\sigma > 0$, $\displaystyle\int \frac{1}{\sqrt{2\pi}\sigma} e^{-x^2/2\sigma^2}\,\mathrm{d}x = 1$.
\end{theorem}

\begin{table}[h]
  \centering
  \caption{Moments of $\mathcal{N}(0, 1)$.}\label{tab:moments}
  \begin{tabular}{lcc}
    \toprule
    Moment & Symbol & Value \\
    \midrule
    Mean     & $\mathbb{E}[x]$   & $0$ \\
    Variance & $\mathbb{E}[x^2]$ & $1$ \\
    Kurtosis & $\mathbb{E}[x^4]$ & $3$ \\
    \bottomrule
  \end{tabular}
\end{table}

\begin{lstlisting}[language=python]
import numpy as np
x = np.random.randn(1_000_000)
print(x.var())   # ≈ 1, see Table 1
\end{lstlisting}

Theorem~\ref{thm:norm} and Table~\ref{tab:moments} are in Section~\ref{sec:gauss}; \cite{gauss1809} has the history.

\begin{thebibliography}{9}
  \bibitem{gauss1809} C. F. Gauss. \emph{Theoria motus corporum coelestium}. 1809.
\end{thebibliography}
